<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="hullRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E5322D"/>
      <stop offset="1" stop-color="#B30D1E"/>
    </linearGradient>
    <linearGradient id="sailOld" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EA"/>
      <stop offset="1" stop-color="#F3DFB8"/>
    </linearGradient>
    <linearGradient id="sailNew" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14365C"/>
      <stop offset="1" stop-color="#0B2038"/>
    </linearGradient>
    <clipPath id="sailClip">
      <path d="M120 24 C166 40 198 88 206 148 L50 148 C60 92 88 46 120 24 Z"/>
    </clipPath>
  </defs>

  <!-- sail base: two halves -->
  <g clip-path="url(#sailClip)">
    <rect x="44" y="18" width="78" height="136" fill="url(#sailOld)"/>
    <rect x="122" y="18" width="90" height="136" fill="url(#sailNew)"/>
    <!-- traditional battens, left half -->
    <g stroke="#C8102E" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M58 62 Q88 54 120 58"/>
      <path d="M54 90 Q88 82 120 86"/>
      <path d="M52 118 Q88 110 120 114"/>
      <path d="M52 140 Q88 134 120 136"/>
    </g>
    <!-- circuit traces, right half -->
    <g stroke="#3FE0FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M122 58 H158 V74 H188"/>
      <path d="M122 86 H146 V100 H182"/>
      <path d="M122 114 H164 V128 H194"/>
      <path d="M122 136 H150 V143 H176"/>
    </g>
    <g fill="#3FE0FF">
      <circle cx="192" cy="74" r="6"/>
      <circle cx="186" cy="100" r="6"/>
      <circle cx="198" cy="128" r="6"/>
      <circle cx="180" cy="143" r="6"/>
    </g>
    <g fill="#9FF1FF" opacity="0.55">
      <circle cx="192" cy="74" r="11"/>
      <circle cx="186" cy="100" r="11"/>
      <circle cx="198" cy="128" r="11"/>
      <circle cx="180" cy="143" r="11"/>
    </g>
  </g>
  <!-- sail outline -->
  <path d="M120 24 C166 40 198 88 206 148 L50 148 C60 92 88 46 120 24 Z" fill="none" stroke="#12212E" stroke-width="5" stroke-linejoin="round"/>
  <!-- mast -->
  <rect x="117" y="16" width="6" height="134" rx="3" fill="#12212E"/>

  <!-- red bow / hull -->
  <path d="M22 172 C30 158 44 152 62 152 L176 152 C194 152 208 144 218 128 C216 148 206 164 190 174 C150 190 66 190 22 172 Z" fill="url(#hullRed)"/>
  <path d="M22 172 C66 190 150 190 190 174" fill="none" stroke="#8F0A18" stroke-width="4" stroke-linecap="round"/>

  <!-- wake / globe meridians -->
  <g fill="none" stroke-linecap="round">
    <path d="M44 200 Q120 218 196 200" stroke="#1D6FB8" stroke-width="5"/>
    <path d="M66 214 Q120 226 174 214" stroke="#3FE0FF" stroke-width="4" opacity="0.75"/>
  </g>
</svg>
